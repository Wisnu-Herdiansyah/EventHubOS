# Local development dependencies only. Credentials come from your untracked .env file.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - eventhub-pg:/var/lib/postgresql/data
volumes:
  eventhub-pg:
